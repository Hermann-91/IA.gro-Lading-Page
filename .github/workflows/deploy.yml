name: Deploy Landing Page to cPanel (HostGator)

on:
  push:
    branches:
      - web

jobs:
  build-and-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configura a versão do Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Instala as dependências do projeto
      - name: Install Dependencies
        run: npm ci

      # 4. Executa o build de produção do Vite (gera a pasta /dist)
      - name: Build Project
        run: npm run build

      # 5. Envia os arquivos gerados em /dist para o cPanel via FTP
      - name: FTP Deploy to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Aponta exatamente para o diretório da HostGator onde o site reside
          server-dir: public_html/ia.gro/
          dry-run: false
